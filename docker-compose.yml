services:
  daemon:
    build:
      context: .
      dockerfile: daemon/Dockerfile
    ports:
      # Mapped to 50052 on the host to avoid conflict with centy-daemon (which uses 50051)
      - "50052:50051"
    environment:
      DAEMON_PORT: "50051"
      DAEMON_HOST: "[::]"
      # Route centy CLI to the host's centy-daemon (host.docker.internal resolves to the host)
      CENTY_DAEMON_ADDR: "host.docker.internal:50051"
      # A registered project path on the host — satisfies centy's startup project-init check.
      # The --global flag still returns issues from all orgs; this is only needed for the hook.
      # Set CENTY_CWD in your .env file to any registered project path on the host.
      CENTY_CWD: "${CENTY_CWD}"
    volumes:
      - daemon-data:/root/.config/team
    # Ensures host.docker.internal resolves correctly on Linux (Docker Desktop handles this automatically)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Connects to the daemon service over Docker's internal network
      DAEMON_ADDR: "daemon:50051"
    depends_on:
      - daemon
    restart: unless-stopped

volumes:
  daemon-data:

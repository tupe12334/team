[package]
name = "tui"
version = "0.1.0"
edition = "2024"
description = "Team TUI - terminal interface for the team daemon"
license = "MIT"

[dependencies]
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ratatui = "0.29"
crossterm = "0.28"
color-eyre = "0.6"
dotenvy = "0.15"

[build-dependencies]
tonic-build = "0.13"

[lints.clippy]
all = "deny"
manual_string_new = "deny"
uninlined_format_args = "deny"
unchecked_time_subtraction = "deny"
# This crate renders through ratatui, which holds the terminal in raw mode on the
# alternate screen. Any stray `print!`/`println!` writes to stdout underneath the
# rendered UI, corrupting the display. Deny direct stdout printing so all output
# goes through the ratatui frame instead.
print_stdout = "deny"
# Require the `Self` keyword instead of repeating the enclosing type name
# inside an `impl` block. Keeps impls DRY and rename-safe: renaming the type
# needs no edits to `Self`-based references, and the intent reads clearer.
use_self = "deny"
# Prefer `Option<&T>` over `&Option<T>` in function signatures. `&Option<T>`
# forces every caller to own an `Option`, whereas `Option<&T>` accepts a borrow
# of either the value or the option, so callers can pass `opt.as_ref()` without
# owning the data. The more idiomatic and flexible API shape.
ref_option = "deny"
# Forbid an `else` block when the preceding `if` already diverges (returns,
# breaks, or continues). The `else` is redundant — its body can be de-indented
# to follow the `if` directly, since control only reaches it when the `if` was
# not taken. Flattening the happy path keeps the dominant branch at the outer
# indentation level instead of nesting it inside `else`. Mirrors the same rule
# enabled in the `daemon` crate.
redundant_else = "deny"
# Prefer `.copied()` over `.cloned()` on iterators/Options of `Copy` types.
# `.copied()` documents that the element is trivially copyable, whereas
# `.cloned()` reads as a potentially expensive deep clone. If the type later
# loses `Copy`, `.copied()` stops compiling and forces a conscious decision.
cloned_instead_of_copied = "deny"
# Flag separate `match` arms that share an identical body so they can be merged
# into one arm with an `|`-pattern. Collapsing the duplicate keeps the match DRY
# and makes accidental divergence (editing one copy of the body but not the
# other) impossible, since there is only ever one body to maintain.
match_same_arms = "deny"
# Forbid glob-importing an enum's variants (`use SomeEnum::*`). A glob pulls an
# unknown, version-dependent set of bare variant names into scope, so a reader can
# no longer tell which enum a given variant belongs to, and adding a variant
# upstream can silently shadow or collide with a local name. The TUI refers to its
# generated proto enums explicitly (e.g. `issue_ref::Ref::Github`); this lint locks
# that style in, keeping each variant's provenance visible at the use site and the
# import surface auditable. No current violations exist, so `deny` keeps the build
# green while preventing future regressions. Mirrors the same rule enforced in the
# `daemon` crate.
enum_glob_use = "deny"

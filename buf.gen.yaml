version: v2
plugins:
  - local: protoc-gen-go
    out: cli/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: cli/gen
    opt: paths=source_relative
  - local: protoc-gen-cobra
    out: cli/gen
    opt: paths=source_relative
  - local: ["go", "run", "github.com/redpanda-data/protoc-gen-go-mcp/cmd/protoc-gen-go-mcp@v0.0.0-20260323112146-887f275039cd"]
    out: cli/gen
    opt: paths=source_relative
  - local: protoc-gen-ts_proto
    out: client/src/gen
    opt:
      - paths=source_relative
      - outputServices=grpc-js
      - esModuleInterop=true
inputs:
  - directory: proto

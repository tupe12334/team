[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
description = "Team daemon service"
license = "MIT"

[dependencies]
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[build-dependencies]
tonic-build = "0.13"

[lints.clippy]
all = "deny"
uninlined_format_args = "deny"
# Forbid `.unwrap()` in production code: a panicking unwrap in a long-running
# daemon takes the whole service down. Use explicit error handling instead.
# (Tests are exempted via cfg(test) in main.rs.)
unwrap_used = "deny"
# Forbid `.expect()` in production code for the same reason as `unwrap_used`:
# an `.expect()` on `None`/`Err` panics and tears down the long-running daemon.
# Prefer propagating errors with `?` or explicit handling instead.
# (Tests are exempted via cfg(test) in main.rs.)
expect_used = "deny"
# Require the `Self` keyword instead of repeating the enclosing type name
# inside an `impl` block. Keeps impls DRY and rename-safe: renaming the type
# needs no edits to `Self`-based references, and the intent reads clearer.
# Mirrors the same rule already enforced in the `tui` crate.
use_self = "deny"
# Prefer `let ... else { ... }` over a `match`/`if let` whose sole job is to
# bind a value or diverge (return/continue/break). The let-else form keeps the
# happy path un-indented and makes the early-exit branch explicit, which reads
# clearer in the daemon's many `find('{')`/`strip_prefix` parsing guards.
manual_let_else = "deny"
# Forbid `.collect()`ing an iterator into a temporary collection only to
# immediately consume it again (e.g. `.contains()`, `.len()`, another adaptor).
# The intermediate allocation is pure overhead — the same check runs lazily on
# the original iterator (`.any()`, `.count()`, …). Keeps the daemon's hot paths
# allocation-free and the intent direct.
needless_collect = "deny"
# Forbid declaring items (`const`, `fn`, `struct`, `use`, …) after statements
# inside a block. The compiler hoists items to the top of their scope, so a
# `const` written halfway down a function is already visible from the block's
# first line — placing it there matches that reality and saves the reader from
# scanning past runtime statements to discover a declaration. Move such items
# to the top of the scope.
items_after_statements = "deny"
# Prefer `String::new()` over manual empty-string construction like `"".into()`
# or `"".to_string()`. `String::new()` states intent directly, does not go
# through a `&str -> String` conversion, and is the canonical way to build an
# empty `String`. Mirrors the same rule already enforced in the `tui` crate,
# keeping empty-string construction consistent across both Rust crates.
manual_string_new = "deny"

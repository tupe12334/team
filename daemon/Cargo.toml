[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
description = "Team daemon service"
license = "MIT"

[dependencies]
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[build-dependencies]
tonic-build = "0.13"

[lints.clippy]
all = "deny"
uninlined_format_args = "deny"
# Forbid `.unwrap()` in production code: a panicking unwrap in a long-running
# daemon takes the whole service down. Use explicit error handling instead.
# (Tests are exempted via cfg(test) in main.rs.)
unwrap_used = "deny"
# Forbid `.expect()` in production code for the same reason as `unwrap_used`:
# an `.expect()` on `None`/`Err` panics and tears down the long-running daemon.
# Prefer propagating errors with `?` or explicit handling instead.
# (Tests are exempted via cfg(test) in main.rs.)
expect_used = "deny"
# Flag `.clone()` calls whose result is dropped without further use: the clone
# allocates a fresh copy only to throw it away, so the original can be moved
# instead. Removing these saves needless allocations and reads more clearly.
redundant_clone = "deny"
# Require the `Self` keyword instead of repeating the enclosing type name
# inside an `impl` block. Keeps impls DRY and rename-safe: renaming the type
# needs no edits to `Self`-based references, and the intent reads clearer.
# Mirrors the same rule already enforced in the `tui` crate.
use_self = "deny"
# Prefer `let ... else { ... }` over a `match`/`if let` whose sole job is to
# bind a value or diverge (return/continue/break). The let-else form keeps the
# happy path un-indented and makes the early-exit branch explicit, which reads
# clearer in the daemon's many `find('{')`/`strip_prefix` parsing guards.
manual_let_else = "deny"
# Forbid `.collect()`ing an iterator into a temporary collection only to
# immediately consume it again (e.g. `.contains()`, `.len()`, another adaptor).
# The intermediate allocation is pure overhead — the same check runs lazily on
# the original iterator (`.any()`, `.count()`, …). Keeps the daemon's hot paths
# allocation-free and the intent direct.
needless_collect = "deny"
# Forbid declaring items (`const`, `fn`, `struct`, `use`, …) after statements
# inside a block. The compiler hoists items to the top of their scope, so a
# `const` written halfway down a function is already visible from the block's
# first line — placing it there matches that reality and saves the reader from
# scanning past runtime statements to discover a declaration. Move such items
# to the top of the scope.
items_after_statements = "deny"
# Prefer `.map_or(default, f)` over `.map(f).unwrap_or(default)`. The combined
# form is a single call that states "map, or this default" in one place, instead
# of building an intermediate `Option` only to immediately unwrap it. Shorter,
# clearer intent, and avoids the easy-to-misread two-step chain.
map_unwrap_or = "deny"
# Prefer `.copied()` over `.cloned()` on iterators/Options of `Copy` types.
# `.copied()` documents that the element is trivially copyable, whereas
# `.cloned()` reads as a potentially expensive deep clone. If the type later
# loses `Copy`, `.copied()` stops compiling and forces a conscious decision.
# Mirrors the same rule enforced in the `tui` crate.
cloned_instead_of_copied = "deny"
# Prefer `String::new()` over manual empty-string construction like `"".into()`
# or `"".to_string()`. `String::new()` states intent directly, does not go
# through a `&str -> String` conversion, and is the canonical way to build an
# empty `String`. Mirrors the same rule already enforced in the `tui` crate,
# keeping empty-string construction consistent across both Rust crates.
manual_string_new = "deny"
# Forbid an `else` block when the preceding `if` already diverges (returns,
# breaks, or continues). The `else` is redundant — its body can be de-indented
# to follow the `if` directly, since control only reaches it when the `if` was
# not taken. Pairs naturally with `manual_let_else` above: the daemon's many
# parsing guards already bail early, so the non-guard path belongs at the outer
# indentation level rather than nested inside `else`. Mirrors the same rule
# enabled in the `tui` crate.
redundant_else = "deny"
# Flag separate `match` arms that share an identical body so they can be merged
# into one arm with an `|`-pattern. Collapsing the duplicate keeps the match DRY
# and makes accidental divergence (editing one copy of the body but not the
# other) impossible, since there is only ever one body to maintain.
# Mirrors the same rule enforced in the `tui` crate.
match_same_arms = "deny"
# Forbid glob-importing an enum's variants (`use SomeEnum::*`). A glob pulls an
# unknown, version-dependent set of bare variant names into scope, so a reader can
# no longer tell which enum a given variant belongs to, and adding a variant
# upstream can silently shadow or collide with a local name. The daemon already
# refers to its generated proto enums explicitly (e.g.
# `reload_config_response::Result::Ok`); this lint locks that style in, keeping
# each variant's provenance visible at the use site and the import surface
# auditable. No current violations exist, so `deny` keeps the build green while
# preventing future regressions. Mirrors the same rule enforced in the `tui` crate.
enum_glob_use = "deny"
# Prefer `for x in &collection` / `&mut collection` over an explicit
# `.iter()`/`.iter_mut()` call in a `for` loop. The borrow form states "iterate
# this" without making the reader confirm which iterator method was used —
# `.iter()` vs `.into_iter()` vs `.iter_mut()` change ownership semantics, so
# the `&`/`&mut` form makes the borrow obvious at the loop head. Mirrors the
# same rule enforced in the `tui` crate.
explicit_iter_loop = "deny"

syntax = "proto3";

package team;

option go_package = "github.com/tupe12334/team/cli/gen;gen";

import "google/protobuf/timestamp.proto";

service WorkerService {
  rpc GetWorkerStatus(WorkerStatusRequest) returns (WorkerStatusResponse);
}

enum WorkerStatus {
  IDLE = 0;
  BUSY = 1;
}

message WorkerInfo {
  string worker_id = 1;
  WorkerStatus status = 2;
  string current_task_id = 3;
  string current_agent = 4;
  google.protobuf.Timestamp task_started_at = 5;
}

message WorkerStatusRequest {}

message WorkerStatusData {
  int32 total = 1;
  int32 busy = 2;
  int32 idle = 3;
  repeated WorkerInfo workers = 4;
}

message WorkerStatusResponse {
  oneof result {
    WorkerStatusData ok = 1;
    string error = 2;
  }
}

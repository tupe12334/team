syntax = "proto3";

package team;

option go_package = "github.com/tupe12334/team/cli/gen;gen";

import "google/protobuf/empty.proto";

service DaemonService {
  rpc GetInfo(google.protobuf.Empty) returns (GetInfoResponse);
  rpc Shutdown(google.protobuf.Empty) returns (ShutdownResponse);
  rpc ReloadConfig(google.protobuf.Empty) returns (ReloadConfigResponse);
}

message DaemonInfo {
  string version = 1;
  int64 uptime_seconds = 2;
  string config_path = 3;
  int32 workers_count = 4;
}

message GetInfoResponse {
  oneof result {
    DaemonInfo ok = 1;
    string error = 2;
  }
}

message ShutdownResponse {
  oneof result {
    google.protobuf.Empty ok = 1;
    string error = 2;
  }
}

message ReloadConfigResponse {
  oneof result {
    google.protobuf.Empty ok = 1;
    string error = 2;
  }
}
